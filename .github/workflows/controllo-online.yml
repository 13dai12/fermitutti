name: Controllo online

on:
  workflow_dispatch:
    inputs:
      dominio:
        description: 'Il dominio da controllare'
        default: 'fermitutti.com'
        required: true
        type: string

permissions: {}

jobs:
  controlla:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # Decommenta le due righe qui sotto se lo script usa pacchetti esterni da package.json
      # - name: Installa dipendenze
      #   run: npm ci

      - name: Controlla il sito pubblicato
        env:
          DOMINIO: ${{ inputs.dominio }}
        run: node scripts/verifica-online.mjs "$DOMINIO"
