# Dependabot propone aggiornamenti per le dipendenze npm e per le azioni di GitHub.
# Dependabot propone una nuova versione solo 7 giorni dopo la sua uscita (cooldown): se una versione è compromessa,
# di solito viene scoperta e ritirata prima. Gli aggiornamenti di sicurezza arrivano subito.
# Unisci le proposte solo se il controllo "Verifica" è verde.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dipendenze:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      azioni:
        patterns: ['*']
